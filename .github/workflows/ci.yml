name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore ERGLauncher.sln

      - name: Build Release solution
        run: dotnet build ERGLauncher.sln --configuration Release --no-restore --warnaserror

      - name: Test Release solution
        run: dotnet test ERGLauncher.sln --configuration Release --no-build --no-restore